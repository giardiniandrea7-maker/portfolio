site:
  name: 'Andrea Giardini — Consulente Finanziario di Fideuram'
  site: 'https://giardiniconsulenza.it'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: 'Andrea Giardini | Consulente Finanziario di Fideuram'
    template: '%s — Andrea Giardini'
  description: "Andrea Giardini, Consulente Finanziario abilitato all'offerta fuori sede di Fideuram – Intesa Sanpaolo Private Banking. Ti affianco nella pianificazione dei tuoi obiettivi di vita."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Andrea Giardini'
    images:
      - url: '/og/og-home-v4.jpg'
        width: 1200
        height: 630
        alt: 'Andrea Giardini, Consulente Finanziario di Fideuram'
    type: website
  twitter:
    handle: '@giardiniconsulenza'
    site: '@giardiniconsulenza'
    cardType: summary_large_image

i18n:
  language: it
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 9

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'categoria'
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Possible values: "system", "light", "dark", "light:only", "dark:only"
